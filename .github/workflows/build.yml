name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the bundled fonts (Archivo Black + Space Mono)
        run: |
          mkdir -p app/src/main/res/font
          BASE=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fL -o app/src/main/res/font/archivo_black.ttf       $BASE/archivoblack/ArchivoBlack-Regular.ttf
          curl -fL -o app/src/main/res/font/space_mono_regular.ttf  $BASE/spacemono/SpaceMono-Regular.ttf
          curl -fL -o app/src/main/res/font/space_mono_bold.ttf     $BASE/spacemono/SpaceMono-Bold.ttf

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrutalBeats-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
